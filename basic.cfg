# Configuration for BASIC ROM
#
# 16K RAM at $0000-$3FFF, 32K ROM at $8000-$FFFF.
#
# Most of the RAM map is hand equated in basic.s rather than allocated here,
# so the regions below only cover what the linker actually places.
MEMORY {
    # zero page. EhBASIC equates $00-$E1 and $EF-$FF, min_mon.s takes $E4/$E5
    # for the ring buffer pointers. only $E2-$EE is free.
    ZP:      start = $0000, size = $0100, type = rw, file = "";

    # $0100 6502 stack, $0200 EhBASIC vectors, IRQ/NMI code and line buffer.
    # both pages are fully spoken for, nothing may be allocated here.
    RAM:     start = $0100, size = $0200, type = rw, file = "";

    # serial receive ring buffer, must stay page aligned
    IBUF:    start = $0300, size = $0100, type = rw, file = "";

    # EhBASIC user program and variables, Ram_base to Ram_top in basic.s.
    # sized at run time by the cold start memory scan, so placing anything
    # here means raising Ram_base to match.
    USERRAM: start = $0400, size = $3c00, type = rw, file = "";

    PRG:     start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    ZEROPAGE:     load = ZP,      type = zp;
    BSS:          load = USERRAM, type = bss;
    INPUT_BUFFER: load = IBUF,    type = bss, align = $100;
    CODE:         load = PRG,     type = ro,  start = $8000;
    VECTORS:      load = PRG,     type = ro,  start = $FFFA;
}
